apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-account
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-account
  template:
    metadata:
      labels:
        app: ms-account
    spec:
      containers:
      - name: ms-account
        image: ms-account:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8100
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:accountdb"
