apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-discovery
  template:
    metadata:
      labels:
        app: ms-discovery
    spec:
      containers:
      - name: ms-discovery
        image: ms-discovery:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8761
